<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Settings &gt; Archive &gt; Children's Records</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding archive-background">
  <div class="archive-wrapper">

    <div *ngIf="archivedChildren().length === 0" class="empty-state">
      <ion-icon name="archive-outline" class="empty-icon"></ion-icon>
      <p>No archived records found.</p>
    </div>

    <div class="archive-list">
      <ion-card *ngFor="let child of archivedChildren()" class="child-card">
        <div class="card-content">

          <div class="card-info" (click)="viewChildDetails(child)">
            <h3 class="child-name">{{ child.name }}</h3>
            <p class="child-meta">Age: {{ child.age }} years old | {{ child.purok }}</p>
            <p class="child-measurements">Wt: {{ child.weight }} kg | Ht: {{ child.height }} cm</p>
          </div>

          <div class="actions-column">
            <ion-badge [color]="getStatusBadgeColor(child.nutritional_status)" class="status-badge">
              {{ child.nutritional_status }}
            </ion-badge>

            <ion-badge color="primary" mode="ios" (click)="confirmRestore(child)" class="restore-badge">
              <ion-icon name="refresh-outline" class="restore-icon"></ion-icon> Restore
            </ion-badge>
          </div>

        </div>
      </ion-card>
    </div>

  </div>
</ion-content>
