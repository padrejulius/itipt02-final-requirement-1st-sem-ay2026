<ion-header>
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/admin-home"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ pageTitle() }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding add-child-content">
  <div class="form-wrapper">
    <form #childForm="ngForm" (ngSubmit)="saveChild(childForm)">
      
      <!-- Full Name of Child -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          label="Full Name of Child" 
          labelPlacement="floating" 
          [ngModel]="child().name"
          (ngModelChange)="updateChildField('name', $event)"
          name="name" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Date of Birth -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          type="date" 
          label="Date of Birth" 
          labelPlacement="floating" 
          [ngModel]="child().dob"
          (ngModelChange)="updateChildField('dob', $event)"
          name="dob" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Gender Selection -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-select 
          label="Gender" 
          labelPlacement="floating" 
          [ngModel]="child().gender"
          (ngModelChange)="updateChildField('gender', $event)"
          name="gender" 
          [disabled]="isViewMode()"
          required>
          <ion-select-option value="Male">Male</ion-select-option>
          <ion-select-option value="Female">Female</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Age (in months) -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          type="number" 
          label="Age" 
          labelPlacement="floating" 
          [ngModel]="child().age"
          (ngModelChange)="updateChildField('age', $event)"
          name="age" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Parent / Guardian Name -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          label="Parent / Guardian Name" 
          labelPlacement="floating" 
          [ngModel]="child().guardian"
          (ngModelChange)="updateChildField('guardian', $event)"
          name="guardian" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Contact Number -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          type="tel" 
          label="Contact Number" 
          labelPlacement="floating" 
          [ngModel]="child().contact"
          (ngModelChange)="updateChildField('contact', $event)"
          name="contact" 
          placeholder="09XXXXXXXXX"
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Assigned Purok -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-select 
          label="Assigned Purok" 
          labelPlacement="floating" 
          [ngModel]="child().purok"
          (ngModelChange)="updateChildField('purok', $event)"
          name="purok" 
          [disabled]="isViewMode()"
          required>
          <ion-select-option value="Purok 1">Purok 1</ion-select-option>
          <ion-select-option value="Purok 2">Purok 2</ion-select-option>
          <ion-select-option value="Purok 3">Purok 3</ion-select-option>
          <ion-select-option value="Purok 4">Purok 4</ion-select-option>
          <ion-select-option value="Purok 5">Purok 5</ion-select-option>
          <ion-select-option value="Purok 6">Purok 6</ion-select-option>
          <ion-select-option value="Purok 7">Purok 7</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Weight (kg) -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          type="number" 
          label="Weight (kg)" 
          labelPlacement="floating" 
          [ngModel]="child().weight"
          (ngModelChange)="updateChildField('weight', $event)"
          name="weight" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Height (cm) -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-input 
          type="number" 
          label="Height (cm)" 
          labelPlacement="floating" 
          [ngModel]="child().height"
          (ngModelChange)="updateChildField('height', $event)"
          name="height" 
          [disabled]="isViewMode()"
          required>
        </ion-input>
      </ion-item>

      <!-- Nutritional Status -->
      <ion-item class="rounded-item ion-margin-bottom">
        <ion-select 
          label="Nutritional Status" 
          labelPlacement="floating" 
          [ngModel]="child().nutritionalStatus"
          (ngModelChange)="updateChildField('nutritionalStatus', $event)"
          name="nutritionalStatus" 
          [disabled]="isViewMode()"
          required>
          <ion-select-option value="Normal">Normal</ion-select-option>
          <ion-select-option value="Underweight">Underweight</ion-select-option>
          <ion-select-option value="Severely Underweight">Severely Underweight</ion-select-option>
          <ion-select-option value="Overweight">Overweight</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Save Button -->
      <ion-button expand="block" type="submit" color="success" class="ion-margin-top save-btn" *ngIf="!isViewMode()" [disabled]="isViewMode()">
        <ion-icon name="save-outline" slot="start"></ion-icon>
        SAVE CHILD RECORD
      </ion-button>

      <!-- Cancel Button -->
      <ion-button expand="block" fill="clear" color="medium" routerLink="/admin-home">
        CANCEL
      </ion-button>

    </form>
  </div>
</ion-content>
