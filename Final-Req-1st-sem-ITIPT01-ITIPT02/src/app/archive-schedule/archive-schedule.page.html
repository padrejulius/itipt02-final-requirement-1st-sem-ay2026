<ion-header [translucent]="true">
  <ion-toolbar color="success">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/archive"></ion-back-button>
    </ion-buttons>
    <ion-title>Settings &gt; Archive &gt; Old Schedule</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding archive-sched-content">
  <div class="schedule-list-wrapper">

    <ion-card
      *ngFor="let schedule of archivedSchedules()"
      (click)="openArchivedScheduleDetails(schedule)"
      class="schedule-card"
    >
      <div class="schedule-card-content">

        <div class="schedule-info">
          <h3 class="schedule-title">{{ schedule.childName }}</h3>
          <p class="schedule-meta">{{ schedule.vaccineType }} - Due: {{ schedule.date }}</p>
        </div>

        <div class="schedule-actions">
          <ion-badge color="primary" class="purok-badge">
            {{ schedule.purok }}
          </ion-badge>

          <ion-badge color="success" (click)="restoreSchedule($event, schedule)" class="restore-badge">
            <ion-icon name="refresh-outline" class="restore-icon"></ion-icon> Restore
          </ion-badge>
        </div>

      </div>
    </ion-card>

    <div *ngIf="archivedSchedules().length === 0" class="empty-state">
      <ion-icon name="archive-outline" class="empty-icon"></ion-icon>
      <p class="empty-text">No archived schedules found.</p>
    </div>

  </div>
</ion-content>
