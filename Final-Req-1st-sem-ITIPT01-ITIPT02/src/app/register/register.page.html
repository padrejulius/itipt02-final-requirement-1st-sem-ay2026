<ion-content class="ion-padding auth-background">
  <div class="register-wrapper">
    
    <!-- App Logo / Branding -->
    <div class="branding-container">
      <div class="logo-badge">
        <ion-icon name="person-add-outline"></ion-icon>
      </div>
      <h1 class="app-title">Create Account</h1>
      <p class="app-subtitle">NutriBantay - BHS Registration</p>
    </div>

    <!-- Register Form -->
    <form (ngSubmit)="onRegister()" class="register-form">
      <div class="input-group">
        <ion-input
          [ngModel]="registrationData().fullName"
          (ngModelChange)="updateField('fullName', $event)"
          name="fullName"
          class="custom-input"
          label="Full Name"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>

        <ion-input
          [ngModel]="registrationData().username"
          (ngModelChange)="updateField('username', $event)"
          name="username"
          class="custom-input"
          label="Email or Username"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>

        <ion-input
          [ngModel]="registrationData().password"
          (ngModelChange)="updateField('password', $event)"
          name="password"
          class="custom-input"
          type="password"
          label="Password"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>

        <ion-input
          [ngModel]="registrationData().confirmPassword"
          (ngModelChange)="updateField('confirmPassword', $event)"
          name="confirmPassword"
          class="custom-input"
          type="password"
          label="Confirm Password"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>
      </div>

      <div class="button-group">
        <ion-button type="submit" expand="block" shape="round" color="success" class="register-btn">
          <ion-icon name="checkmark-circle-outline" slot="start"></ion-icon>
          Sign Up
        </ion-button>
        <ion-button type="button" expand="block" shape="round" fill="clear" color="medium" (click)="onCancel()" class="cancel-btn">
          Cancel / Back to Login
        </ion-button>
      </div>
    </form>

  </div>
</ion-content>
