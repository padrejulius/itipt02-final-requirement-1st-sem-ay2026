<ion-content class="ion-padding auth-background">
  <div class="login-wrapper">
    
    <!-- App Logo / Branding -->
    <div class="branding-container">
      <div class="logo-badge">
        <ion-icon name="heart-circle-outline"></ion-icon>
      </div>
      <h1 class="app-title">NutriBantay</h1>
      <p class="app-subtitle">BHS Immunization & Feeding Program Tracker</p>
    </div>

    <!-- Login Form -->
    <form (ngSubmit)="onLogin()" class="login-form">
      <div class="input-group">
        <ion-input
          [ngModel]="credentials().username"
          (ngModelChange)="updateField('username', $event)"
          name="username"
          id="username"
          class="custom-input"
          label="Username"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>

        <ion-input
          [ngModel]="credentials().password"
          (ngModelChange)="updateField('password', $event)"
          name="password"
          id="password"
          class="custom-input"
          type="password"
          label="Password"
          label-placement="floating"
          fill="solid"
          required>
        </ion-input>
      </div>

      <div class="button-group">
        <ion-button type="submit" expand="block" shape="round" color="success" class="login-btn">
          <ion-icon name="log-in-outline" slot="start"></ion-icon>
          Sign In
        </ion-button>
        <ion-button type="button" expand="block" shape="round" fill="clear" (click)="onCancel()" class="cancel-btn" color="danger">
          Cancel
        </ion-button>
      </div>
    </form>

    <!-- Register Link -->
    <div class="register-link-container">
      <p>Don't have an account? 
        <a (click)="goToRegister()" class="register-link">Register here</a>
      </p>
    </div>

  </div>
</ion-content>
